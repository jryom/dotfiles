# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

notARepository: "skip"
promptToReturnFromSubprocess: false
disableStartupPopups: true
git:
  branchLogCmd: 'git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=format:"%C(auto)%h: %s (%C(blue)%an %C(white)| %C(cyan)%ad%C(white))" {{branchName}} --'
  diffRenderers:
    - command: delta --{{colorScheme}} --syntax-theme={{if eq .colorScheme "light"}}GitHub{{else}}ansi{{end}} --paging=never
gui:
  expandFocusedSidePanel: true
  filterMode: fuzzy
  showDivergenceFromBaseBranch: arrowAndNumber
  showRandomTip: false
  showBottomLine: false
  showPanelJumps: false
  sidePanelWidth: 0.2
  skipStashWarning: true
  theme:
    authorColors:
      "*": "blue"
  darkTheme:
    activeBorderColor:
      - bold
    inactiveBorderColor:
      - "#5f5650"
    selectedLineBgColor:
      - "#332d2b"
  lightTheme:
    activeBorderColor:
      - white
      - bold
    inactiveBorderColor:
      - "#d5c9c3"
    selectedLineBgColor:
      - "#E9E4E2"
keybinding:
  files:
    commitChanges: "C"
    commitChangesWithEditor: "c"
    toggleTreeView: "t"
  commits:
    renameCommit: "R"
    renameCommitWithEditor: "r"
